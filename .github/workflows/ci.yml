name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgres://postgres:devpass@localhost:5432/tracklib_test

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: devpass
          POSTGRES_DB: tracklib_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build

      - name: Apply schema
        run: psql "$TEST_DATABASE_URL" -f db/schema.sql

      - run: npm run test:ci
